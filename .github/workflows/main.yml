          w('app/src/main/java/ro/profitride/OfferReader.kt', r'''
          package ro.profitride

          import android.accessibilityservice.AccessibilityService
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.core.content.ContextCompat
          import java.io.File
          import java.util.Locale

          class OfferReader : AccessibilityService() {

              companion object {
                  @Volatile var isStopped = false
                  private val OFFICIAL_PACKAGES = listOf(
                      "ee.mtakso",
                      "com.ubercab",
                      "com.mytaxi",
                      "com.clever"
                  )
                  private const val MS_BETWEEN_EVENTS = 500L
                  private const val MS_DEDUP_WINDOW = 5 * 60 * 1000L
                  private const val MS_OVERLAY_AUTODISMISS = 25_000L
                  private const val MAX_DEBUG_SIZE = 500_000L
              }

              private var overlay: View? = null
              private var sideBarView: View? = null
              private var sidePanelView: View? = null
              private lateinit var wm: WindowManager
              private val handler = Handler(Looper.getMainLooper())
              private val autoDismiss = Runnable { removeOverlay() }

              private var tts: TextToSpeech? = null
              private var vibrator: Vibrator? = null
              private val sb = StringBuilder(2048)
              private var lastParseAt = 0L
              private var lastOfferKey = ""

              private var pendingOffer: OfferParser.Offer? = null
              private var offerAcceptedAt = 0L
              private var lastSavedPrice = 0f
              private var lastSavedKm = 0f
              private var lastSavedAt = 0L

              private fun isOfficialPackage(pkg: String): Boolean = OFFICIAL_PACKAGES.any { pkg.startsWith(it) }

              private fun logDbg(msg: String) {
                  try {
                      val f = File(filesDir, "debug.txt")
                      if (f.exists() && f.length() > MAX_DEBUG_SIZE) f.delete()
                      f.appendText("${System.currentTimeMillis()}: $msg\n")
                  } catch (_: Throwable) {}
              }

              private val screenOff = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) {
                      if (i?.action == Intent.ACTION_SCREEN_OFF) { removeOverlay(); removeSidePanel() }
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  try {
                      wm = getSystemService(WINDOW_SERVICE) as WindowManager
                      vibrator = if (Build.VERSION.SDK_INT >= 31)
                          (getSystemService(VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator
                      else @Suppress("DEPRECATION") getSystemService(VIBRATOR_SERVICE) as Vibrator
                      tts = TextToSpeech(this) { status -> if (status == TextToSpeech.SUCCESS) tts?.language = Locale("ro", "RO") }
                      try { ContextCompat.registerReceiver(this, screenOff, IntentFilter(Intent.ACTION_SCREEN_OFF), ContextCompat.RECEIVER_NOT_EXPORTED) } catch (_: Throwable) {}
                      if (!isStopped) showSideBar()
                  } catch (_: Throwable) {}
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (isStopped) return
                  if (event == null) return
                  try {
                      val pkg = event.packageName?.toString()?.lowercase() ?: return
                      if (!isOfficialPackage(pkg)) return
                      val now = SystemClock.elapsedRealtime()
                      if (now - lastParseAt < MS_BETWEEN_EVENTS) return
                      lastParseAt = now
                      val root = rootInActiveWindow ?: return
                      sb.setLength(0)
                      collect(root, sb, 0)
                      val raw = sb.toString().lowercase()
                      if (raw.isEmpty()) return

                      if (raw.contains("accept")) {
                          val offer = OfferParser.parse(raw, avgSpeed())
                          if (offer != null) {
                              val key = "${offer.priceRon}|${offer.pickupKm}|${offer.tripKm}"
                              if (key != lastOfferKey) {
                                  lastOfferKey = key
                                  pendingOffer = offer
                                  offerAcceptedAt = 0L
                                  val result = Calc.compute(this, offer)
                                  logDbg("OFERTA: $key")
                                  showOverlay(result)
                                  speak(result)
                                  vibrate(result.color)
                              }
                          } else {
                              logDbg("PARSE FAIL (len=${raw.length})")
                          }
                      } else if (pendingOffer != null && offerAcceptedAt == 0L) {
                          offerAcceptedAt = System.currentTimeMillis()
                          logDbg("ACCEPTAT: ${pendingOffer?.priceRon} RON")
                      }

                      val finished = raw.contains("cursă finalizată") || raw.contains("cursa finalizata") ||
                                     raw.contains("ai câștigat") || raw.contains("ai castigat") ||
                                     raw.contains("total câștigat") || raw.contains("total castigat") ||
                                     raw.contains("suma încasată") || raw.contains("suma incasata") ||
                                     raw.contains("tarif final") ||
                                     raw.contains("trip completed") || raw.contains("ride finished")

                      if (finished && pendingOffer != null && offerAcceptedAt > 0L) {
                          val saved = trySaveFinished(raw)
                          if (saved) {
                              pendingOffer = null
                              offerAcceptedAt = 0L
                              lastOfferKey = ""
                          }
                      }
                  } catch (e: Throwable) {
                      logDbg("EVENT ERR: ${e.message?.take(80)}")
                  }
              }

              private fun trySaveFinished(raw: String): Boolean {
                  try {
                      val finalPrice = extractPriceFromFinalization(raw) ?: return false
                      if (finalPrice < 1f) return false
                      val (pickupKm, tripKm) = extractKmFromFinalization(raw, pendingOffer)
                      val totalKm = pickupKm + tripKm
                      val now = System.currentTimeMillis()
                      if (Math.abs(finalPrice - lastSavedPrice) < 0.05f &&
                          Math.abs(totalKm - lastSavedKm) < 0.05f &&
                          now - lastSavedAt < MS_DEDUP_WINDOW) {
                          logDbg("SKIP duplicat")
                          return true
                      }
                      val realOffer = OfferParser.Offer(
                          priceRon = finalPrice, pickupKm = pickupKm, tripKm = tripKm,
                          pickupMinutes = pendingOffer?.pickupMinutes ?: 0,
                          tripMinutes = pendingOffer?.tripMinutes ?: 0
                      )
                      val r = Calc.compute(this, realOffer)
                      val line = "$now,$finalPrice,$pickupKm,$tripKm,${r.grossPerKm},${if (r.totalMin > 0) r.netProfit/(r.totalMin/60f) else 0f},${r.totalExpenses},${r.netProfit},${r.commissionCut},${r.fuelCost},${r.extraCost}"
                      val parts = line.split(",")
                      if (parts.size < 11 || parts[0].toLongOrNull() == null || parts[1].toFloatOrNull() == null) {
                          logDbg("CSV INVALID")
                          return false
                      }
                      openFileOutput("offers.csv", Context.MODE_APPEND).bufferedWriter().use { it.appendLine(line) }
                      lastSavedPrice = finalPrice
                      lastSavedKm = totalKm
                      lastSavedAt = now
                      logDbg("SALVAT: $finalPrice RON, $totalKm km")
                      handler.post {
                          Toast.makeText(this@OfferReader,
                              "✅ Salvat: ${"%.2f".format(finalPrice)} RON · ${"%.1f".format(totalKm)} km",
                              Toast.LENGTH_LONG).show()
                      }
                      showFinalConfirm(r)
                      return true
                  } catch (e: Throwable) {
                      logDbg("SAVE ERR: ${e.message?.take(80)}")
                      return false
                  }
              }

              private fun extractPriceFromFinalization(raw: String): Float? {
                  try {
                      val patterns = listOf(
                          Regex("""tarif[^\d]*(\d+[.,]?\d*)\s*(?:RON|lei)""", RegexOption.IGNORE_CASE),
                          Regex("""total[^\d]*(\d+[.,]?\d*)\s*(?:RON|lei)""", RegexOption.IGNORE_CASE),
                          Regex("""ai (?:câștigat|castigat)[^\d]*(\d+[.,]?\d*)\s*(?:RON|lei)""", RegexOption.IGNORE_CASE),
                          Regex("""încasat[^\d]*(\d+[.,]?\d*)\s*(?:RON|lei)""", RegexOption.IGNORE_CASE)
                      )
                      for (p in patterns) {
                          p.find(raw)?.let { m ->
                              val v = m.groupValues[1].replace(',', '.').toFloatOrNull()
                              if (v != null && v in 1f..2000f) return v
                          }
                      }
                      return Regex("""(\d+(?:[.,]\d+)?)\s*(?:RON|lei)""", RegexOption.IGNORE_CASE)
                          .findAll(raw)
                          .mapNotNull { it.groupValues[1].replace(',', '.').toFloatOrNull() }
                          .filter { it in 3f..2000f }
                          .maxOrNull()
                  } catch (_: Throwable) { return null }
              }

              private fun extractKmFromFinalization(raw: String, pending: OfferParser.Offer?): Pair<Float, Float> {
                  try {
                      if (pending != null) return Pair(pending.pickupKm, pending.tripKm)
                      val kms = Regex("""(\d+(?:[.,]\d+)?)\s*km""", RegexOption.IGNORE_CASE)
                          .findAll(raw).mapNotNull { it.groupValues[1].replace(',', '.').toFloatOrNull() }.toList()
                      if (kms.size >= 2) return Pair(kms[0], kms[1])
                      if (kms.size == 1) return Pair(0f, kms[0])
                  } catch (_: Throwable) {}
                  return Pair(0f, 0f)
              }

              private fun showFinalConfirm(r: Calc.Result) {
                  try {
                      removeOverlay()
                      val density = resources.displayMetrics.density
                      val container = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = GradientDrawable().apply {
                              setColor(Color.parseColor("#EE111111"))
                              cornerRadius = 24f * density
                              setStroke((4 * density).toInt(), Color.parseColor("#4CAF50"))
                          }
                          setPadding((16*density).toInt(), (12*density).toInt(), (16*density).toInt(), (12*density).toInt())
                      }
                      val title = TextView(this).apply {
                          text = "✅ Salvat"
                          setTextColor(Color.parseColor("#4CAF50"))
                          textSize = 14f
                          typeface = Typeface.DEFAULT_BOLD
                          gravity = Gravity.CENTER
                      }
                      val detail = TextView(this).apply {
                          text = "%.2f RON · %.1f km · %.2f RON/km".format(r.priceRon, r.totalKm, r.grossPerKm)
                          setTextColor(Color.WHITE)
                          textSize = 12f
                          gravity = Gravity.CENTER
                          setPadding(0, (4*density).toInt(), 0, 0)
                      }
                      container.addView(title)
                      container.addView(detail)
                      val type = if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                          type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                      ).apply { gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL; x = 0; y = (150*density).toInt() }
                      wm.addView(container, params)
                      overlay = container
                      handler.postDelayed({ removeOverlay() }, 4000L)
                  } catch (_: Throwable) {}
              }

              private fun avgSpeed(): Float {
                  val v = getSharedPreferences("cfg", MODE_PRIVATE).getFloat("avgSpeedKmh", 25f)
                  return if (v >= 5f) v else 25f
              }
              private fun collect(node: AccessibilityNodeInfo?, sb: StringBuilder, depth: Int) {
                  if (node == null || depth > 40 || sb.length > 20000) return
                  node.text?.toString()?.trim()?.let { if (it.isNotEmpty()) sb.append(it).append('\n') }
                  node.contentDescription?.toString()?.trim()?.let { if (it.isNotEmpty()) sb.append(it).append('\n') }
                  for (i in 0 until node.childCount) collect(node.getChild(i), sb, depth + 1)
              }
              private fun speak(r: Calc.Result) {
                  if (!getSharedPreferences("cfg", MODE_PRIVATE).getBoolean("ttsEnabled", true)) return
                  try { tts?.speak(r.speech, TextToSpeech.QUEUE_FLUSH, null, "offer") } catch (_: Throwable) {}
              }
              private fun vibrate(color: Int) {
                  try {
                      val v = vibrator ?: return
                      val ms = when (color) { Color.parseColor("#4CAF50") -> 120L; Color.parseColor("#FFEB3B") -> 250L; else -> 500L }
                      if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
                      else @Suppress("DEPRECATION") v.vibrate(ms)
                  } catch (_: Throwable) {}
              }

              private fun showOverlay(r: Calc.Result) {
                  try {
                      removeOverlay()
                      val density = resources.displayMetrics.density
                      val container = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = GradientDrawable().apply {
                              setColor(Color.parseColor("#EE000000"))
                              cornerRadius = 28f * density
                              setStroke((4 * density).toInt(), r.color)
                          }
                          setPadding((12*density).toInt(), (10*density).toInt(), (12*density).toInt(), (8*density).toInt())
                          setOnTouchListener(dragListener())
                          elevation = 20f
                      }
                      val headerRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                      }
                      val header = TextView(this).apply {
                          text = r.label
                          setTextColor(r.color)
                          textSize = 13f
                          typeface = Typeface.DEFAULT_BOLD
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      }
                      val closeBtn = TextView(this).apply {
                          text = "✕"
                          setTextColor(Color.parseColor("#AAAAAA"))
                          textSize = 16f
                          setPadding((8*density).toInt(), 0, 0, 0)
                          setOnClickListener { removeOverlay() }
                      }
                      headerRow.addView(header)
                      headerRow.addView(closeBtn)
                      container.addView(headerRow)

                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER }
                      val gaugeSize = (110 * density).toInt()
                      val margin = (4*density).toInt()

                      val gauge1 = GaugeView(this).apply {
                          percent = (r.grossPerKm / 5f).coerceIn(0f, 1f)
                          arcColor = r.color
                          valueText = "%.2f".format(r.grossPerKm)
                          labelText = "RON/km"
                          layoutParams = LinearLayout.LayoutParams(gaugeSize, gaugeSize).apply { marginEnd = margin }
                      }
                      val gauge2 = GaugeView(this).apply {
                          val ratio = if (r.priceRon > 0f) r.netProfit / r.priceRon else 0f
                          percent = ratio.coerceIn(0f, 1f)
                          arcColor = r.color
                          valueText = "%.0f".format(r.netProfit)
                          labelText = "RĂMÂNE"
                          subLabelText = "Chelt: %.0f".format(r.totalExpenses)
                          layoutParams = LinearLayout.LayoutParams(gaugeSize, gaugeSize).apply { marginStart = margin }
                      }
                      row.addView(gauge1)
                      row.addView(gauge2)
                      container.addView(row)

                      val footer = TextView(this).apply {
                          text = "%.1f km · %d min · %.2f RON".format(r.totalKm, r.totalMin, r.priceRon)
                          setTextColor(Color.parseColor("#AAAAAA"))
                          textSize = 10f
                          gravity = Gravity.CENTER
                          setPadding(0, (6*density).toInt(), 0, 0)
                      }
                      container.addView(footer)

                      val type = if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                          type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                      ).apply { gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL; x = 0; y = (100*density).toInt() }
                      wm.addView(container, params)
                      overlay = container
                      container.tag = params
                      handler.postDelayed(autoDismiss, MS_OVERLAY_AUTODISMISS)
                  } catch (_: Throwable) {}
              }

              private fun dragListener(): View.OnTouchListener {
                  var sX = 0; var sY = 0; var tX = 0f; var tY = 0f; var moved = false
                  return View.OnTouchListener { v, e ->
                      val p = v.tag as? WindowManager.LayoutParams ?: return@OnTouchListener false
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { sX = p.x; sY = p.y; tX = e.rawX; tY = e.rawY; moved = false; true }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - tX).toInt(); val dy = (e.rawY - tY).toInt()
                              if (dx * dx + dy * dy > 100) moved = true
                              if (moved) { p.x = sX + dx; p.y = sY + dy; try { wm.updateViewLayout(v, p) } catch (_: Exception) {} }
                              true
                          }
                          MotionEvent.ACTION_UP -> { if (!moved) removeOverlay(); true }
                          else -> false
                      }
                  }
              }
              private fun removeOverlay() {
                  try {
                      handler.removeCallbacks(autoDismiss)
                      overlay?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                      overlay = null
                  } catch (_: Throwable) {}
              }

              private fun showSideBar() {
                  if (sideBarView != null) return
                  try {
                      val density = resources.displayMetrics.density
                      val widthPx = (6 * density).toInt()
                      val heightPx = (180 * density).toInt()
                      val bar = View(this).apply {
                          background = GradientDrawable().apply {
                              shape = GradientDrawable.RECTANGLE
                              setColor(Color.parseColor("#80D32F2F"))
                              cornerRadii = floatArrayOf(0f, 6f*density, 6f*density, 0f, 0f, 6f*density, 6f*density, 0f)
                          }
                          setOnClickListener { toggleSidePanel() }
                          setOnTouchListener(sideBarDragListener())
                      }
                      val type = if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                      val params = WindowManager.LayoutParams(widthPx, heightPx, type,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          PixelFormat.TRANSLUCENT).apply {
                          gravity = Gravity.START or Gravity.CENTER_VERTICAL; x = 0; y = 0
                      }
                      wm.addView(bar, params)
                      sideBarView = bar
                      bar.tag = params
                  } catch (_: Throwable) {}
              }

              private fun sideBarDragListener(): View.OnTouchListener {
                  var startY = 0; var touchY = 0f; var moved = false
                  return View.OnTouchListener { v, e ->
                      val params = v.tag as? WindowManager.LayoutParams ?: return@OnTouchListener false
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { startY = params.y; touchY = e.rawY; moved = false; true }
                          MotionEvent.ACTION_MOVE -> {
                              val dy = (e.rawY - touchY).toInt()
                              if (Math.abs(dy) > 15) moved = true
                              if (moved) { params.y = startY + dy; try { wm.updateViewLayout(v, params) } catch (_: Exception) {} }
                              true
                          }
                          MotionEvent.ACTION_UP -> { if (!moved) v.performClick(); true }
                          else -> false
                      }
                  }
              }

              private fun toggleSidePanel() {
                  if (sidePanelView != null) { removeSidePanel(); return }
                  showSidePanel()
              }

              private fun showSidePanel() {
                  removeSidePanel()
                  try {
                      val density = resources.displayMetrics.density
                      val panel = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = GradientDrawable().apply {
                              setColor(Color.parseColor("#F0111111"))
                              cornerRadius = 20f * density
                              setStroke((2*density).toInt(), Color.parseColor("#4CAF50"))
                          }
                          setPadding((16*density).toInt(), (16*density).toInt(), (16*density).toInt(), (16*density).toInt())
                      }
                      val title = TextView(this).apply {
                          text = "ProfitRide · Activ"
                          setTextColor(Color.parseColor("#4CAF50"))
                          textSize = 16f
                          typeface = Typeface.DEFAULT_BOLD
                          setPadding(0, 0, 0, (10*density).toInt())
                      }
                      panel.addView(title)
                      val info = TextView(this).apply {
                          text = readLastOfferInfo()
                          setTextColor(Color.WHITE)
                          textSize = 12f
                          typeface = Typeface.MONOSPACE
                          setPadding(0, 0, 0, (14*density).toInt())
                      }
                      panel.addView(info)
                      fun addBtn(text: String, color: Int, onClick: () -> Unit) {
                          val b = Button(this).apply {
                              this.text = text
                              setTextColor(Color.WHITE)
                              textSize = 13f
                              background = GradientDrawable().apply { setColor(color); cornerRadius = 30f * density }
                              setPadding((12*density).toInt(), (8*density).toInt(), (12*density).toInt(), (8*density).toInt())
                              setOnClickListener { onClick() }
                          }
                          panel.addView(b)
                      }
                      addBtn("📊 Sumar Zilnic", Color.parseColor("#9C27B0")) {
                          removeSidePanel()
                          val i = Intent(this, SummaryActivity::class.java); i.putExtra("PERIOADA", "DAY"); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(i)
                      }
                      addBtn("⚙️ Setări costuri", Color.parseColor("#2196F3")) {
                          removeSidePanel()
                          val i = Intent(this, SettingsActivity::class.java); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(i)
                      }
                      addBtn("🚗 Autovehicul", Color.parseColor("#E91E63")) {
                          removeSidePanel()
                          val i = Intent(this, VehicleActivity::class.java); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(i)
                      }
                      addBtn("⏹ Oprește", Color.parseColor("#B71C1C")) {
                          isStopped = true; removeSidePanel(); removeSideBar()
                          handler.post { Toast.makeText(this@OfferReader, "Serviciu oprit", Toast.LENGTH_SHORT).show() }
                      }
                      val type = if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                      val params = WindowManager.LayoutParams((280 * density).toInt(), WindowManager.LayoutParams.WRAP_CONTENT, type,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply {
                          gravity = Gravity.START or Gravity.CENTER_VERTICAL; x = (20 * density).toInt(); y = 0
                      }
                      wm.addView(panel, params)
                      sidePanelView = panel
                      handler.postDelayed({ removeSidePanel() }, 15000L)
                  } catch (_: Throwable) {}
              }

              private fun readLastOfferInfo(): String {
                  return try {
                      val lines = openFileInput("offers.csv").bufferedReader().use { it.readLines() }
                      val last = lines.lastOrNull { it.isNotBlank() } ?: return "Nicio cursă salvată încă."
                      val p = last.split(",")
                      if (p.size >= 8) {
                          val km = (p[2].toFloatOrNull() ?: 0f) + (p[3].toFloatOrNull() ?: 0f)
                          "Ultima cursă:\n" +
                          "Tarif:  ${"%.2f".format(p[1].toFloatOrNull() ?: 0f)} RON\n" +
                          "Km:     ${"%.1f".format(km)}\n" +
                          "RON/km: ${"%.2f".format(p[4].toFloatOrNull() ?: 0f)}\n" +
                          "Net:    ${"%.2f".format(p[7].toFloatOrNull() ?: 0f)} RON"
                      } else "Date incomplete"
                  } catch (_: Exception) { "Nicio cursă salvată încă." }
              }

              private fun removeSidePanel() { try { sidePanelView?.let { wm.removeView(it) } } catch (_: Throwable) {}; sidePanelView = null }
              private fun removeSideBar() { try { sideBarView?.let { wm.removeView(it) } } catch (_: Throwable) {}; sideBarView = null }

              override fun onInterrupt() { removeOverlay(); removeSideBar(); removeSidePanel() }
              override fun onDestroy() {
                  removeOverlay(); removeSideBar(); removeSidePanel()
                  try { unregisterReceiver(screenOff) } catch (_: Throwable) {}
                  try { tts?.stop(); tts?.shutdown() } catch (_: Throwable) {}
                  tts = null
                  super.onDestroy()
              }
          }
          ''')
          PYEOF

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfitRide-APK
          path: app/build/outputs/apk/debug/app-debug.apk
