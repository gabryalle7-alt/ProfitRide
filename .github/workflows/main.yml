                          android:layout_marginTop="8dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
                      <Button android:id="@+id/btnAccessibility" android:text="Activează citirea automată"
                          android:background="@drawable/rounded_btn" android:backgroundTint="#FF9800"
