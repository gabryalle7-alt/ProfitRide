name: Build ProfitRide APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Decode keystore
        run: |
          if [ ! -f app/keystore.b64 ]; then
            echo "ERROR: app/keystore.b64 lipseste din repo."
            exit 1
          fi
          base64 -d app/keystore.b64 > app/release.jks
          echo "Keystore decoded OK"

      - name: Create project files with Python
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import os

          def w(path, text):
              d = os.path.dirname(path)
              if d: os.makedirs(d, exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(text.strip() + '\n')

          w('README.md', '# ProfitRide\nAplicatie pentru calculat profitul curselor.')
          w('local.properties', f'sdk.dir={os.environ["ANDROID_HOME"]}')
          w('gradle.properties', '''
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          ''')
          w('settings.gradle', '''
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "ProfitRide"
          include ':app'
          ''')
          w('build.gradle', '''
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          ''')

          # build.gradle - parolele vin STRICT din env (GitHub Secrets), ZERO hardcodare
          w('app/build.gradle', '''
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          def ksPwd = System.getenv("KEYSTORE_PASSWORD")
          def keyPwd = System.getenv("KEY_PASSWORD")
          if (!ksPwd || !keyPwd) {
              throw new GradleException("Lipsesc KEYSTORE_PASSWORD sau KEY_PASSWORD din GitHub Secrets!")
          }
          android {
              namespace 'ro.profitride'
              compileSdk 34
              defaultConfig {
                  applicationId "ro.profitride"
                  minSdk 24
                  targetSdk 34
                  versionCode 29
                  versionName "4.6"
              }
              signingConfigs {
                  release {
                      storeFile file("release.jks")
                      storePassword ksPwd
                      keyAlias "profitride"
                      keyPassword keyPwd
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.release; minifyEnabled false }
                  debug { signingConfig signingConfigs.release }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.work:work-runtime-ktx:2.9.0'
          }
          ''')

          w('app/src/main/AndroidManifest.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_car"
                  android:label="ProfitRide"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".SettingsActivity"/>
                  <activity android:name=".SetupActivity"/>
                  <activity android:name=".SummaryActivity"/>
                  <activity android:name=".VehicleActivity"/>
                  <service android:name=".OfferReader" android:exported="true" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config"/>
                  </service>
              </application>
          </manifest>
          ''')

          w('app/src/main/res/drawable/ic_car.xml', '''
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#000000" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#FF1744" android:strokeWidth="11" android:strokeLineCap="round"
                  android:strokeLineJoin="round" android:fillColor="#00000000"
                  android:pathData="M48,24 L48,84 M48,24 L68,24 Q84,24 84,39 Q84,54 68,54 L48,54 M65,54 L84,84"/>
              <path android:strokeColor="#FF1744" android:strokeWidth="11" android:strokeLineCap="round"
                  android:strokeLineJoin="round" android:fillColor="#00000000"
                  android:pathData="M22,24 L22,84 M22,24 L44,24 Q60,24 60,39 Q60,54 44,54 L22,54"/>
          </vector>
          ''')

          w('app/src/main/res/xml/accessibility_service_config.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="500"
              android:description="@string/acc_desc"/>
          ''')

          w('app/src/main/res/values/strings.xml', '''
          <resources>
              <string name="app_name">ProfitRide</string>
              <string name="acc_desc">Citeste ofertele Bolt/Uber pentru a calcula profitul curselor</string>
          </resources>
          ''')

          w('app/src/main/res/drawable/bg_gradient.xml', '''
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:startColor="#E3F2FD" android:endColor="#FFFFFF" android:angle="270" />
          </shape>
          ''')

          w('app/src/main/res/drawable/card_bg.xml', '''
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FFFFFF"/>
              <corners android:radius="16dp"/>
          </shape>
          ''')

          w('app/src/main/res/drawable/rounded_btn.xml', '''
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FFFFFF"/>
              <corners android:radius="30dp"/>
          </shape>
          ''')

          w('app/src/main/res/layout/activity_main.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:fillViewport="true" android:background="@drawable/bg_gradient">
              <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content">
                  <TextView android:id="@+id/tvStatus"
