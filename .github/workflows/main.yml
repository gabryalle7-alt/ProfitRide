          w('app/src/main/java/ro/profitride/OfferParser.kt', '''
          package ro.profitride

          object OfferParser {
              data class Offer(
                  val priceRon: Float,
                  val pickupKm: Float,
                  val tripKm: Float,
                  val pickupMinutes: Int,
                  val tripMinutes: Int
              )

              private val PRICE_LABELED = Regex("""(\\d+(?:[.,]\\d{1,2})?)\\s*(?:RON|lei)""", RegexOption.IGNORE_CASE)
              private val PRICE_ANY = Regex("""(\\d+(?:[.,]\\d{1,2})?)""")
              private val KM_REGEX = Regex("""(\\d+(?:[.,]\\d+)?)\\s*km""", RegexOption.IGNORE_CASE)
              private val MIN_REGEX = Regex("""(\\d+)\\s*min""", RegexOption.IGNORE_CASE)

              fun parse(text: String, avgSpeedKmh: Float = 25f): Offer? {
                  return try {
                      val price = findPrice(text) ?: return null
                      val kms = KM_REGEX.findAll(text).mapNotNull { it.groupValues[1].replace(',', '.').toFloatOrNull() }.toList()
                      val mins = MIN_REGEX.findAll(text).mapNotNull { it.groupValues[1].toIntOrNull() }.toList()
                      if (kms.isEmpty()) return null
                      var pickupKm = 0f; var tripKm = 0f
                      if (kms.size >= 2) {
                          pickupKm = kms[0]; tripKm = kms[1]
                          if (pickupKm > tripKm * 2.5f) { val t = pickupKm; pickupKm = tripKm; tripKm = t }
                      } else if (kms.size == 1) tripKm = kms[0]
                      var pickupMin = 0; var tripMin = 0
                      if (mins.size >= 2) {
                          pickupMin = mins[0]; tripMin = mins[1]
                          if (pickupMin > tripMin * 3) { val t = pickupMin; pickupMin = tripMin; tripMin = t }
                      } else if (mins.size == 1) tripMin = mins[0]
                      if (tripMin == 0) tripMin = ((tripKm / avgSpeedKmh) * 60).toInt()
                      if (pickupMin == 0) pickupMin = ((pickupKm / avgSpeedKmh) * 60).toInt()
                      Offer(price, pickupKm, tripKm, pickupMin, tripMin)
                  } catch (_: Throwable) { null }
              }

              private fun findPrice(text: String): Float? {
                  val labeled = PRICE_LABELED.findAll(text)
                      .mapNotNull { it.groupValues[1].replace(',', '.').toFloatOrNull() }
                      .filter { it in 3f..2000f }
                      .maxOrNull()
                  if (labeled != null) return labeled
                  return PRICE_ANY.findAll(text)
                      .mapNotNull { m ->
                          val valStr = m.groupValues[1]
                          val after = text.substring(m.range.last + 1).take(10).lowercase()
                          if (after.contains("km") || after.contains("min") || after.contains("ron")) null
                          else valStr.replace(',', '.').toFloatOrNull()
                      }
                      .filter { it in 5f..500f }
                      .maxOrNull()
              }
          }
          ''')

          w('app/src/main/java/ro/profitride/Calc.kt', '''
          package ro.profitride
          import android.content.Context
          import android.graphics.Color

          object Calc {
              data class Result(
                  val text: String, val color: Int, val label: String,
                  val grossPerKm: Float, val netProfit: Float, val totalExpenses: Float,
                  val commissionCut: Float, val fuelCost: Float, val extraCost: Float,
                  val totalKm: Float, val totalMin: Int, val priceRon: Float, val speech: String
              )
              private val GREEN = Color.parseColor("#4CAF50")
              private val YELLOW = Color.parseColor("#FFEB3B")
              private val RED = Color.parseColor("#FF5252")

              fun compute(ctx: Context, o: OfferParser.Offer): Result {
                  val p = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val fuelPrice = p.getFloat("fuelPrice", 7.5f)
                  val consumption = p.getFloat("consumption", 7f)
                  val commission = p.getFloat("commission", 20f)
                  val extraPerKm = p.getFloat("extraCost", 0.5f)
                  val minPerKm = p.getFloat("minPerKm", 2.5f)
                  val totalKm = o.pickupKm + o.tripKm
                  val totalMin = o.pickupMinutes + o.tripMinutes
                  val grossPerKm = if (totalKm > 0f) o.priceRon / totalKm else 0f
                  val commissionCut = o.priceRon * commission / 100f
                  val fuelCost = totalKm / 100f * consumption * fuelPrice
                  val extraCost = totalKm * extraPerKm
                  val totalExpenses = commissionCut + fuelCost + extraCost
                  val netProfit = o.priceRon - totalExpenses

                  val (label, color) = when {
                      grossPerKm >= minPerKm * 1.2f -> "PROFITABIL" to GREEN
                      grossPerKm >= minPerKm -> "MEDIU" to YELLOW
                      else -> "NEPROFITABIL" to RED
                  }

                  val text = """
                      [%s]
                      ---------------------
                      %.2f RON/km
                      ---------------------
                      Total: %.1f km | %d min
                      Tarif: %.2f RON
                      Chelt: %.2f RON
                      Rămâne: %.2f RON
                  """.trimIndent().format(label, grossPerKm, totalKm, totalMin, o.priceRon, totalExpenses, netProfit)

                  val speech = when (label) {
                      "PROFITABIL" -> "Profitabil. ${grossPerKm.toInt()} lei pe km."
                      "MEDIU" -> "Mediu."
                      else -> "Neprofitabil."
                  }
                  return Result(text, color, label, grossPerKm, netProfit, totalExpenses, commissionCut, fuelCost, extraCost, totalKm, totalMin, o.priceRon, speech)
              }
          }
          ''')

          w('app/src/main/java/ro/profitride/GaugeView.kt', '''
          package ro.profitride

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.view.View

          class GaugeView(context: Context) : View(context) {
              var percent: Float = 0f
              var arcColor: Int = Color.GREEN
              var valueText: String = ""
              var labelText: String = ""
              var subLabelText: String = ""

              private val bgArcPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; color = Color.parseColor("#333333"); strokeCap = Paint.Cap.ROUND
              }
              private val fgArcPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND
              }
              private val valuePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  textAlign = Paint.Align.CENTER; typeface = Typeface.DEFAULT_BOLD
              }
              private val labelPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  textAlign = Paint.Align.CENTER; color = Color.WHITE
              }
              private val subLabelPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  textAlign = Paint.Align.CENTER; color = Color.parseColor("#AAAAAA")
              }

              override fun onDraw(canvas: Canvas) {
                  try {
                      super.onDraw(canvas)
                      val w = width.toFloat(); val h = height.toFloat()
                      if (w <= 0 || h <= 0) return
                      val density = resources.displayMetrics.density
                      val stroke = 14f * density
                      val cx = w / 2; val cy = h / 2
                      val radius = Math.min(w, h) / 2 - stroke / 2 - 2f * density
                      if (radius <= 0) return
                      bgArcPaint.strokeWidth = stroke
                      fgArcPaint.strokeWidth = stroke
                      val rectF = RectF(cx - radius, cy - radius, cx + radius, cy + radius)
                      canvas.drawArc(rectF, 135f, 270f, false, bgArcPaint)
                      fgArcPaint.color = arcColor
                      canvas.drawArc(rectF, 135f, 270f * percent.coerceIn(0f, 1f), false, fgArcPaint)
                      valuePaint.color = arcColor
                      valuePaint.textSize = Math.min(w, h) * 0.24f
                      canvas.drawText(valueText, cx, cy + valuePaint.textSize * 0.32f, valuePaint)
                      labelPaint.textSize = Math.min(w, h) * 0.08f
                      canvas.drawText(labelText, cx, cy + valuePaint.textSize * 0.34f + labelPaint.textSize * 1.1f, labelPaint)
                      if (subLabelText.isNotEmpty()) {
                          subLabelPaint.textSize = Math.min(w, h) * 0.065f
                          canvas.drawText(subLabelText, cx, cy - Math.min(w, h) * 0.13f, subLabelPaint)
                      }
                  } catch (_: Throwable) {}
              }
          }
          ''')

          w('app/src/main/java/ro/profitride/MainActivity.kt', '''
          package ro.profitride
          import android.Manifest
          import android.animation.ArgbEvaluator
          import android.animation.ValueAnimator
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.MotionEvent
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.work.ExistingPeriodicWorkPolicy
          import androidx.work.PeriodicWorkRequestBuilder
          import androidx.work.WorkManager
          import java.util.concurrent.TimeUnit

          class MainActivity : AppCompatActivity() {
              private var etPickup: EditText? = null
              private var etTrip: EditText? = null
              private var etPrice: EditText? = null
              private var tvStatus: TextView? = null
              private var tvResult: TextView? = null
              private val handler = Handler(Looper.getMainLooper())
              private val calcRunnable = Runnable { safeCalculate() }
              private var ignoreWatcher = false

              private val watcher = object : TextWatcher {
                  override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                  override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {
                      if (ignoreWatcher) return
                      handler.removeCallbacks(calcRunnable)
                      handler.postDelayed(calcRunnable, 250L)
                  }
                  override fun afterTextChanged(s: Editable?) {}
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try { setContentView(R.layout.activity_main) } catch (_: Throwable) { finish(); return }
                  try { requestNotifPermission() } catch (_: Throwable) {}
                  try { initWorkManager() } catch (_: Throwable) {}
                  try { initViews() } catch (_: Throwable) {}
                  try { initListeners() } catch (_: Throwable) {}
              }

              private fun requestNotifPermission() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                      }
                  }
              }

              private fun initWorkManager() {
                  val workRequest = PeriodicWorkRequestBuilder<ExpiryWorker>(1, TimeUnit.DAYS).build()
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork("ExpiryCheck", ExistingPeriodicWorkPolicy.KEEP, workRequest)
              }

              private fun initViews() {
                  etPickup = findViewById(R.id.etPickup)
                  etTrip = findViewById(R.id.etTrip)
                  etPrice = findViewById(R.id.etPrice)
                  tvStatus = findViewById(R.id.tvStatus)
                  tvResult = findViewById(R.id.tvResult)
                  etPickup?.addTextChangedListener(watcher)
                  etTrip?.addTextChangedListener(watcher)
                  etPrice?.addTextChangedListener(watcher)
              }

              private fun initListeners() {
                  findViewById<Button>(R.id.btnCalc)?.setOnClickListener { safeCalculate() }
                  findViewById<Button>(R.id.btnSumarZilnic)?.setOnClickListener { openSummary("DAY") }
                  findViewById<Button>(R.id.btnSumarSaptamanal)?.setOnClickListener { openSummary("WEEK") }
                  findViewById<Button>(R.id.btnSumarLunar)?.setOnClickListener { openSummary("MONTH") }
                  findViewById<Button>(R.id.btnSumarAnual)?.setOnClickListener { openSummary("YEAR") }
                  findViewById<Button>(R.id.btnVehicle)?.setOnClickListener { safeStart(VehicleActivity::class.java) }
                  findViewById<Button>(R.id.btnSettings)?.setOnClickListener { safeStart(SettingsActivity::class.java) }
                  findViewById<Button>(R.id.btnAccessibility)?.setOnClickListener {
                      try {
                          if (!Settings.canDrawOverlays(this)) Toast.makeText(this, "Acorda intai permisiunea overlay", Toast.LENGTH_LONG).show()
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      } catch (_: Exception) {}
                  }
                  findViewById<Button>(R.id.btnOverlay)?.setOnClickListener {
                      try { startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))) } catch (_: Exception) {}
                  }
                  findViewById<Button>(R.id.btnDebug)?.setOnClickListener { showDebug() }
                  findViewById<Button>(R.id.btnStopAll)?.setOnClickListener { confirmStop() }
                  listOf(R.id.btnCalc, R.id.btnSumarZilnic, R.id.btnSumarSaptamanal, R.id.btnSumarLunar,
                      R.id.btnSumarAnual, R.id.btnVehicle, R.id.btnSettings, R.id.btnAccessibility,
                      R.id.btnOverlay, R.id.btnDebug, R.id.btnStopAll).forEach { id ->
                      findViewById<Button>(id)?.let { apply3DClick(it) }
                  }
              }

              private fun safeStart(cls: Class<*>) { try { startActivity(Intent(this, cls)) } catch (_: Exception) {} }
              private fun openSummary(per: String) { try { startActivity(Intent(this, SummaryActivity::class.java).putExtra("PERIOADA", per)) } catch (_: Exception) {} }

              private fun showDebug() {
                  try {
                      val debugContent = try { openFileInput("debug.txt").bufferedReader().use { it.readText() } } catch (e: Exception) { "Nu exista date." }
                      AlertDialog.Builder(this).setTitle("Log debug:").setMessage(debugContent.takeLast(5000)).setPositiveButton("OK", null).show()
                  } catch (_: Exception) {}
              }

              private fun confirmStop() {
                  try {
                      AlertDialog.Builder(this).setTitle("Oprire Totală").setMessage("Sigur vrei să oprești serviciul?")
                          .setPositiveButton("Da") { _, _ -> OfferReader.isStopped = true; finish() }
                          .setNegativeButton("Nu", null).show()
                  } catch (_: Exception) {}
              }

              private fun apply3DClick(button: View) {
                  button.setOnTouchListener { v, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> v.animate().scaleX(0.95f).scaleY(0.95f).setDuration(100).start()
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> v.animate().scaleX(1f).scaleY(1f).setDuration(100).start()
                      }
                      false
                  }
              }

              override fun onResume() {
                  super.onResume()
                  try {
                      OfferReader.isStopped = false
                      val offers = getSharedPreferences("offers", MODE_PRIVATE)
                      if (offers.getBoolean("fresh", false)) {
                          ignoreWatcher = true
                          etPickup?.setText(offers.getFloat("pickupKm", 0f).toString())
                          etTrip?.setText(offers.getFloat("tripKm", 0f).toString())
                          etPrice?.setText(offers.getFloat("price", 0f).toString())
                          ignoreWatcher = false
                          offers.edit().putBoolean("fresh", false).apply()
                          safeCalculate()
                      }
                  } catch (_: Exception) {}
              }

              private fun safeCalculate() {
                  try {
                      val pp = etPickup?.text?.toString()?.toFloatOrNull() ?: 0f
                      val t = etTrip?.text?.toString()?.toFloatOrNull() ?: 0f
                      val pr = etPrice?.text?.toString()?.toFloatOrNull() ?: 0f
                      if (pp == 0f && t == 0f && pr == 0f) {
                          tvStatus?.text = "Introdu datele cursei"
                          tvStatus?.setTextColor(Color.parseColor("#888888"))
                          tvResult?.text = ""
                          return
                      }
                      val r = Calc.compute(this, OfferParser.Offer(pr, pp, t, 0, 0))
                      tvStatus?.text = r.label
                      tvStatus?.setTextColor(r.color)
                      tvResult?.text = r.text
                      tvResult?.setTextColor(r.color)
                      val anim = ValueAnimator.ofObject(ArgbEvaluator(), Color.parseColor("#111111"), r.color)
                      anim.duration = 300
                      anim.addUpdateListener { a -> (a.animatedValue as? Int)?.let { tvStatus?.setBackgroundColor(it) } }
                      anim.start()
                  } catch (_: Exception) {}
              }

              override fun onDestroy() { handler.removeCallbacks(calcRunnable); super.onDestroy() }
          }
          ''')

