                      android:textColor="#888888" android:elevation="8dp"
                      android:text="Introdu datele cursei"/>
                  <LinearLayout android:orientation="vertical" android:padding="20dp"
                      android:layout_width="match_parent" android:layout_height="wrap_content">
                      <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:background="@drawable/card_bg" android:elevation="6dp"
                          android:outlineProvider="background" android:padding="16dp" android:layout_marginBottom="16dp">
                          <TextView android:text="Km până la preluare" android:textColor="#757575" android:textSize="12sp"
                              android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                          <EditText android:id="@+id/etPickup" android:inputType="numberDecimal" android:hint="0.0"
                              android:textSize="20sp" android:textStyle="bold" android:background="@null"
                              android:layout_width="match_parent" android:layout_height="wrap_content"/>
                      </LinearLayout>
                      <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:background="@drawable/card_bg" android:elevation="6dp"
                          android:outlineProvider="background" android:padding="16dp" android:layout_marginBottom="16dp">
                          <TextView android:text="Km cursă (cu pasager)" android:textColor="#757575" android:textSize="12sp"
                              android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                          <EditText android:id="@+id/etTrip" android:inputType="numberDecimal" android:hint="0.0"
                              android:textSize="20sp" android:textStyle="bold" android:background="@null"
