                              android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/>
                          <Button android:id="@+id/btnSumarLunar" android:text="Lunar"
                              android:background="@drawable/rounded_btn" android:backgroundTint="#FF9800"
                              android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="12sp" android:elevation="4dp"
                              android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/>
                          <Button android:id="@+id/btnSumarAnual" android:text="Anual"
                              android:background="@drawable/rounded_btn" android:backgroundTint="#2196F3"
                              android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="12sp" android:elevation="4dp"
                              android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/>
                      </LinearLayout>
                      <Button android:id="@+id/btnVehicle" android:text="Rubrică Autovehicul"
                          android:background="@drawable/rounded_btn" android:backgroundTint="#E91E63"
                          android:textColor="#FFFFFF" android:textStyle="bold" android:elevation="6dp"
                          android:layout_marginTop="16dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
                      <Button android:id="@+id/btnSettings" android:text="Setări costuri"
