                      <Button android:id="@+id/btnSaveVehicle" android:text="SALVEAZĂ"
                          android:background="@drawable/rounded_btn" android:backgroundTint="#4CAF50"
                          android:textColor="#FFFFFF" android:textStyle="bold" android:elevation="6dp"
                          android:layout_weight="1" android:layout_width="0dp" android:layout_height="wrap_content"/>
                      <Button android:id="@+id/btnResetVehicle" android:text="RESET"
                          android:background="@drawable/rounded_btn" android:backgroundTint="#F44336"
                          android:textColor="#FFFFFF" android:textStyle="bold" android:elevation="6dp"
                          android:layout_marginLeft="12dp" android:layout_weight="1" android:layout_width="0dp" android:layout_height="wrap_content"/>
                  </LinearLayout>
              </LinearLayout>
          </ScrollView>
          ''')

          w('app/src/main/res/layout/activity_settings.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="@drawable/bg_gradient">
